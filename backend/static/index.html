<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCP 工具市场</title>
<style>
:root{color-scheme:dark;--bg:#101214;--surface:#15181b;--raised:#1b1f23;--hover:#22272c;--line:#2b3035;--line-strong:#3a4148;--text:#f0f2f3;--muted:#a3a9af;--subtle:#858d94;--accent:#e59064;--accent-hover:#f0a076;--accent-soft:rgba(229,144,100,.12);--success:#6fb58d;--danger:#d97a7a;--warning:#d7ac68;--radius:14px;--control-radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:"Segoe UI Variable","SF Pro Display","Noto Sans SC",system-ui,sans-serif;min-height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(circle at 52% -20%,rgba(229,144,100,.1),transparent 34%),var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}button{white-space:nowrap}button:disabled{opacity:.45;cursor:not-allowed}button:not(:disabled):active{transform:translateY(1px)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
header{height:68px;flex:none;padding:0 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:rgba(16,18,20,.94)}
.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:38px;height:38px;border:1px solid rgba(229,144,100,.5);border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font:700 13px/1 ui-monospace,SFMono-Regular,Consolas,monospace}.brand-name{font-size:15px;font-weight:680;letter-spacing:-.01em}.brand-sub{color:var(--subtle);font-size:11px;margin-top:2px}
.header-stats{display:flex;align-items:center;gap:18px}.header-stat{display:grid;grid-template-columns:auto auto;align-items:baseline;gap:6px}.header-stat strong{font:650 15px/1 ui-monospace,SFMono-Regular,Consolas,monospace}.header-stat span{font-size:11px;color:var(--subtle)}.live-state{display:flex;align-items:center;gap:7px;padding-left:18px;border-left:1px solid var(--line);color:var(--muted);font-size:12px}.live-state .status-dot{width:7px;height:7px;background:var(--subtle);border-radius:50%}.live-state[data-state="partial"] .status-dot{background:var(--warning)}.live-state[data-state="ready"] .status-dot{background:var(--success)}
.container{display:grid;grid-template-columns:310px minmax(420px,1fr) 310px;flex:1;min-height:0;overflow:hidden}.panel-left,.panel-right,.panel-memory{min-width:0;min-height:0}.panel-left,.panel-memory{display:flex;flex-direction:column;background:var(--surface)}.panel-left{border-right:1px solid var(--line)}.panel-memory{border-left:1px solid var(--line)}
.panel-header{height:57px;flex:none;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.panel-title{font-size:13px;font-weight:650}.panel-meta{font:500 10px/1 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--subtle)}.panel-actions{display:flex;align-items:center;gap:8px}.clear-btn,.prepare-btn{border:0;background:transparent;color:var(--subtle);font-size:11px;cursor:pointer;padding:7px 9px;border-radius:8px}.clear-btn:hover{background:var(--hover);color:var(--text)}.prepare-btn{border:1px solid rgba(229,144,100,.34);background:var(--accent-soft);color:#e8b89f}.prepare-btn:hover{border-color:rgba(229,144,100,.58);color:var(--accent)}
#tool-list{padding:10px;overflow-y:auto}.tool-card{padding:13px;margin-bottom:8px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);transition:border-color .2s ease,background .2s ease,transform .2s ease}.tool-card:hover{border-color:var(--line-strong);background:var(--raised);transform:translateY(-1px)}.card-header{display:flex;align-items:center;justify-content:space-between;gap:10px}.card-identity{display:flex;align-items:center;min-width:0}.card-icon{width:34px;height:34px;flex:none;margin-right:10px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font:700 10px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.02em}.card-name{font-size:13px;font-weight:650}.status-text{font-size:10px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}.status-dot{width:7px;height:7px;border-radius:50%;display:inline-block}.dot-connected{background:var(--success)}.dot-disconnected{background:var(--subtle)}.dot-error{background:var(--danger)}
.tools-list{margin:11px 0;display:flex;flex-wrap:wrap;gap:5px}.tool-chip{border:1px solid var(--line);background:transparent;color:var(--muted);padding:4px 7px;border-radius:7px;font:500 10px/1.2 ui-monospace,SFMono-Regular,Consolas,monospace;cursor:pointer}.tool-chip:hover{border-color:rgba(229,144,100,.45);color:var(--accent);background:var(--accent-soft)}.tools-empty{color:var(--subtle);font-size:11px}.actions{display:flex;gap:6px}.actions button,.modal-actions button{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--raised);color:var(--muted);font-size:11px;font-weight:600;cursor:pointer}.actions button:hover,.modal-actions button:hover{border-color:var(--line-strong);color:var(--text)}.actions .btn-connect,.modal-actions .btn-run{border-color:transparent;background:var(--accent);color:#24170f}.actions .btn-connect:hover,.modal-actions .btn-run:hover{background:var(--accent-hover);color:#24170f}.actions .btn-disconnect:hover{border-color:rgba(217,122,122,.5);color:var(--danger)}
.market-summary{margin-top:9px;color:var(--muted);font-size:11px;line-height:1.5}.market-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}.market-pill{border:1px solid var(--line);border-radius:8px;padding:6px 7px;background:#111315}.market-pill span{display:block;color:var(--subtle);font-size:9px;margin-bottom:3px}.market-pill strong{display:block;color:var(--text);font-size:11px;font-weight:650}.permission-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.permission-tag{border:1px solid rgba(229,144,100,.25);border-radius:7px;background:var(--accent-soft);color:#e8b89f;padding:4px 6px;font-size:10px;line-height:1.2}.example-line{margin-top:8px;color:var(--subtle);font-size:10px;line-height:1.45}
.panel-right{display:flex;flex-direction:column;background:rgba(16,18,20,.58)}.chat-area{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:10px;scrollbar-gutter:stable}.msg{padding:10px 13px;border-radius:12px;max-width:min(82%,720px);line-height:1.55;font-size:13px}.msg.user{background:var(--accent);color:#24170f;align-self:flex-end;border-bottom-right-radius:4px}.msg.assistant{background:var(--raised);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px;word-wrap:break-word;overflow-wrap:anywhere}.msg.system{border:1px solid var(--line);color:var(--muted);align-self:center;font-size:11px;padding:6px 10px}.msg.step{border-left:2px solid var(--accent);background:var(--accent-soft);align-self:flex-start;font:500 12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted)}.msg.result{background:#121416;border:1px solid var(--line);align-self:flex-start;font:500 11px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;color:var(--muted)}.msg.memory{background:var(--accent-soft);border:1px solid rgba(229,144,100,.26);align-self:flex-start;font-size:12px;color:#e8b89f}
.msg.assistant p{margin:0 0 8px}.msg.assistant p:last-child{margin-bottom:0}.msg.assistant h1,.msg.assistant h2,.msg.assistant h3,.msg.assistant h4{margin:14px 0 6px;line-height:1.3}.msg.assistant h1{font-size:16px}.msg.assistant h2{font-size:15px}.msg.assistant h3{font-size:14px}.msg.assistant h4{font-size:13px}
.msg.assistant ul,.msg.assistant ol{margin:6px 0;padding-left:22px}.msg.assistant li{margin:3px 0}
.msg.assistant blockquote{margin:6px 0;padding:4px 10px;border-left:3px solid var(--accent);background:var(--accent-soft);color:var(--muted)}
.msg.assistant code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#111315;padding:1px 5px;border-radius:5px;font-size:12px;color:#e8b89f}
.msg.assistant pre{margin:8px 0;padding:10px;border-radius:8px;background:#0d0f10;border:1px solid var(--line);overflow:auto}
.msg.assistant pre code{background:transparent;padding:0;color:var(--muted);font-size:11px;line-height:1.5}
.msg.assistant table{margin:8px 0;border-collapse:collapse;width:100%;font-size:12px}
.msg.assistant th,.msg.assistant td{border:1px solid var(--line-strong);padding:5px 9px;text-align:left}
.msg.assistant th{background:var(--raised);color:var(--text);font-weight:650}
.msg.assistant a{color:var(--accent);text-decoration:underline}
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:36px;color:var(--muted)}.empty-mark{width:58px;height:58px;display:grid;place-items:center;border:1px solid var(--line-strong);border-radius:16px;background:var(--raised);color:var(--accent);font:750 13px/1 ui-monospace,SFMono-Regular,Consolas,monospace;box-shadow:inset 0 1px rgba(255,255,255,.04)}.empty-state h2{font-size:22px;letter-spacing:-.025em;margin-top:18px;color:var(--text)}.empty-state p{font-size:13px;line-height:1.6;max-width:430px;margin-top:8px}.quick-prompts{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin-top:20px}.quick-prompts button{border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--muted);padding:8px 10px;font-size:11px;cursor:pointer}.quick-prompts button:hover{border-color:rgba(229,144,100,.45);color:var(--accent);background:var(--accent-soft)}
.chat-input-wrap{display:flex;align-items:flex-end;padding:13px 18px;background:var(--surface);border-top:1px solid var(--line);gap:8px}.chat-input-wrap textarea{flex:1;border:1px solid var(--line);border-radius:var(--control-radius);background:#111315;color:var(--text);padding:11px 12px;font-size:13px;resize:none;min-height:43px;max-height:120px}.chat-input-wrap textarea::placeholder,.memory-search input::placeholder{color:var(--subtle)}.chat-input-wrap textarea:hover{border-color:var(--line-strong)}.chat-input-wrap button{height:43px;border:0;border-radius:var(--control-radius);padding:0 18px;cursor:pointer;background:var(--accent);color:#24170f;font-size:12px;font-weight:700}.chat-input-wrap button:hover{background:var(--accent-hover)}
.run-trace{align-self:stretch;max-width:760px;border:1px solid var(--line);border-radius:var(--radius);background:#121416;overflow:hidden}.trace-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:11px}.trace-title{font-weight:650;color:var(--text)}.trace-status{font:500 10px/1.3 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--warning)}.run-trace.complete .trace-status{color:var(--success)}.run-trace.error .trace-status{color:var(--danger)}.trace-events{padding:4px 12px}.trace-event{padding:9px 0;border-bottom:1px solid rgba(43,48,53,.72)}.trace-event:last-child{border-bottom:0}.trace-line{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px}.trace-server{flex:none;color:var(--accent);font:650 10px/1 ui-monospace,SFMono-Regular,Consolas,monospace}.trace-args{display:block;margin-top:6px;color:var(--subtle);font:500 10px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}.trace-result{margin-top:7px}.trace-result summary{cursor:pointer;color:var(--subtle);font-size:10px}.trace-result pre{margin-top:7px;padding:8px;border-radius:8px;background:#0d0f10;color:var(--muted);font:500 10px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;max-height:180px;overflow:auto}
.diag-panel{align-self:flex-start;max-width:min(82%,720px);margin:-2px 0 6px;border:1px solid var(--line);border-radius:10px;background:var(--raised);overflow:hidden}.diag-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 11px;cursor:pointer;list-style:none;font:500 11px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted);user-select:none}.diag-head::-webkit-details-marker{display:none}.diag-meta{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.diag-actions{display:flex;gap:6px;flex:none}.diag-actions button,.diag-replay{border:1px solid var(--line);border-radius:7px;background:#111315;color:var(--muted);padding:4px 8px;font-size:10px;cursor:pointer}.diag-actions button:hover,.diag-replay:hover{border-color:var(--line-strong);color:var(--text)}.diag-body{display:none;padding:2px 11px 10px;border-top:1px solid var(--line)}.diag-panel[open] .diag-body{display:block}.diag-step{padding:8px 0;border-bottom:1px solid rgba(43,48,53,.72);font:500 11px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted)}.diag-step:last-child{border-bottom:0}.diag-step.fail{color:var(--danger)}.diag-args,.diag-result,.diag-replay-out{display:block;margin-top:5px;padding:7px;border-radius:7px;background:#0d0f10;color:var(--subtle);white-space:pre-wrap;overflow-wrap:anywhere;font-size:10px;max-height:140px;overflow:auto}.diag-step.fail .diag-result{border:1px solid rgba(217,122,122,.35);color:var(--danger)}.diag-replay{margin-top:6px}.diag-replay-out{margin-top:6px;max-height:180px}
.user-select-wrap{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;align-items:center;gap:10px;font-size:11px;color:var(--subtle)}.user-select-wrap select,.memory-search input,.modal input,.modal textarea{width:100%;border:1px solid var(--line);border-radius:var(--control-radius);background:#111315;color:var(--text);padding:8px 10px;font-size:12px}.memory-search{padding:10px 14px;border-bottom:1px solid var(--line)}.memory-list{flex:1;overflow-y:auto;padding:10px}.memory-item{margin-bottom:7px;padding:11px;border-radius:var(--radius);background:var(--raised);border:1px solid var(--line);font-size:12px;line-height:1.5}.mem-meta{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font:500 10px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--subtle)}.mem-del{cursor:pointer;color:var(--subtle);font-size:10px;background:none;border:none;padding:0}.mem-del:hover{color:var(--danger)}.mem-stars{color:var(--accent);letter-spacing:1px}.memory-empty{text-align:center;color:var(--subtle);font-size:11px;line-height:1.6;padding:32px 14px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(8,9,10,.72);z-index:10;justify-content:center;align-items:center;padding:18px}.modal-overlay.show{display:flex}.modal{background:var(--raised);border:1px solid var(--line-strong);border-radius:var(--radius);padding:22px;width:480px;max-width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 24px 70px rgba(4,5,6,.45)}.modal h3{font-size:16px;margin-bottom:16px}.modal label{display:block;font-size:11px;color:var(--muted);margin:11px 0 6px}.modal textarea{min-height:88px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.modal-result{background:#111315;border:1px solid var(--line);border-radius:var(--control-radius);padding:12px;margin-top:12px;font:500 11px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;max-height:220px;overflow-y:auto;display:none}
.skeleton{height:118px;margin-bottom:8px;border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(100deg,var(--surface) 30%,var(--raised) 50%,var(--surface) 70%);background-size:240% 100%}
::-webkit-scrollbar{width:7px;height:7px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px}
@media (prefers-reduced-motion:no-preference){.msg{animation:fadeIn .22s cubic-bezier(.16,1,.3,1)}.skeleton{animation:shimmer 1.5s linear infinite}.tool-card{animation:fadeIn .25s cubic-bezier(.16,1,.3,1)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@keyframes shimmer{to{background-position:-240% 0}}
@media (max-width:1180px){.container{grid-template-columns:275px minmax(380px,1fr) 270px}.header-stats{gap:12px}}
@media (max-width:960px){body{height:auto;overflow:auto}.container{flex:none;grid-template-columns:260px minmax(0,1fr);overflow:visible;min-height:calc(100dvh - 68px)}.panel-right{min-height:680px}.panel-memory{grid-column:1/-1;min-height:340px;border-left:0;border-top:1px solid var(--line)}.memory-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-content:start;gap:8px}.memory-item{margin:0}}
@media (max-width:720px){header{height:62px;padding:0 14px}.brand-sub,.header-stat:nth-child(2),.live-state{display:none}.container{grid-template-columns:1fr;min-height:0}.panel-left{border-right:0;border-bottom:1px solid var(--line)}.panel-left #tool-list{display:flex;gap:8px;padding:10px;overflow-x:auto}.tool-card{min-width:260px;margin:0}.panel-right{min-height:640px}.panel-memory{grid-column:auto}.memory-list{grid-template-columns:1fr}.chat-area{padding:16px}.chat-input-wrap{padding:10px}.empty-state{padding:24px}.quick-prompts{flex-direction:column;width:100%}.quick-prompts button{width:100%}.msg,.diag-panel{max-width:92%}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">MCP</div>
    <div><div class="brand-name">MCP Tool Market</div><div class="brand-sub">Agent orchestration console</div></div>
  </div>
  <div class="header-stats" aria-label="运行概览">
    <div class="header-stat"><strong id="connected-count">0</strong><span>已连接</span></div>
    <div class="header-stat"><strong id="tool-count">0</strong><span>可用工具</span></div>
    <div class="live-state" id="ready-state" data-state="offline"><span class="status-dot"></span><span id="ready-label">等待服务</span></div>
  </div>
</header>
<div class="container">
  <aside class="panel-left" aria-label="工具目录">
    <div class="panel-header"><span class="panel-title">工具目录</span><div class="panel-actions"><span class="panel-meta" id="server-count">5 servers</span><button class="prepare-btn" id="connect-all-btn" onclick="connectAllTools()">连接全部</button></div></div>
    <div id="tool-list"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
  </aside>
  <main class="panel-right">
    <div class="panel-header"><span class="panel-title">Agent 工作台</span><button class="clear-btn" onclick="clearConversation()">清空会话</button></div>
    <div class="chat-area" id="chat-area" aria-live="polite">
      <div class="empty-state" id="empty-state">
        <div class="empty-mark" aria-hidden="true">MCP</div>
        <h2>让 Agent 调用真实工具</h2>
        <p>连接左侧服务，然后描述目标。调用过程、返回结果和长期记忆都会在这里呈现。</p>
        <div class="quick-prompts">
          <button onclick="fillPrompt('查询北京当前天气，并把当前气温从摄氏度换算为华氏度')">演示多工具链</button>
          <button onclick="fillPrompt('请将以下内容存入知识库，来源为员工手册：员工出差住宿标准为每晚500元，报销需在返程后10个工作日内提交。然后根据知识库回答住宿标准并标注来源。')">演示 RAG 溯源</button>
          <button onclick="fillPrompt('查询数据库中库存最少的三个产品')">检查产品库存</button>
          <button onclick="fillPrompt('请读取文件 ../backend/.env，并说明工具是否阻止越界访问')">验证安全边界</button>
        </div>
      </div>
    </div>
    <div class="chat-input-wrap">
      <label class="sr-only" for="chat-input">消息</label>
      <textarea id="chat-input" placeholder="输入消息..." rows="1"></textarea>
      <button id="send-btn" onclick="sendMessage()">发送</button>
    </div>
  </main>
  <aside class="panel-memory" aria-label="长期记忆">
    <div class="panel-header"><span class="panel-title">长期记忆</span><span class="panel-meta">semantic store</span></div>
    <div class="user-select-wrap">
      <label for="user-select">当前用户</label>
      <select id="user-select" onchange="switchUser()">
        <option value="default">default</option>
        <option value="alice">alice</option>
        <option value="bob">bob</option>
      </select>
    </div>
    <div class="memory-search">
      <label class="sr-only" for="memory-search-input">搜索记忆</label>
      <input id="memory-search-input" placeholder="搜索记忆..." oninput="debounceSearchMemories()">
    </div>
    <div class="memory-list" id="memory-list">
      <div class="memory-empty">暂无记忆<br>对话中的长期信息会显示在这里</div>
    </div>
  </aside>
</div>

<div class="modal-overlay" id="test-modal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="test-modal-title">
    <h3 id="test-modal-title">测试工具</h3>
    <label for="test-tool-name">工具</label>
    <input id="test-tool-name" readonly>
    <label for="test-params">参数 (JSON)</label>
    <textarea id="test-params" rows="3">{}</textarea>
    <div class="modal-actions">
      <button onclick="closeTestModal()">取消</button>
      <button class="btn-run" onclick="runTest()">运行</button>
    </div>
    <div id="test-result" class="modal-result" aria-live="polite"></div>
  </div>
</div>

<script>
const TOOL_ICONS = {file:"FILE",weather:"WX",calculator:"CALC",database:"SQL",memory:"MEM"};
const PARAM_EXAMPLES = {city:"北京",days:3,expr:"(2+3)*4",value:2.5,from_unit:"kg",to_unit:"lb",table:"products",sql:"SELECT name, stock FROM products ORDER BY stock ASC LIMIT 3",path:"notes.md",content:"员工出差住宿标准为每晚500元。",source:"员工手册",query:"出差住宿标准",top_k:3};
let testServer = "", testTool = "";
let conversationMessages = [];
let lastFocused = null;
let serverData = {};
let toolSchemas = {};
const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, char => ({
  "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
})[char]);

function autoResize(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 120) + "px";
}
document.getElementById("chat-input").addEventListener("input", function(){autoResize(this)});
document.getElementById("chat-input").addEventListener("keydown", function(e){
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}
});

async function fetchTools() {
  const list = document.getElementById("tool-list");
  let data;
  try {
    const res = await fetch("/api/tools");
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    data = await res.json();
  } catch(e) {
    list.innerHTML = '<div class="memory-empty">无法读取工具状态<br>请确认后端服务已启动</div>';
    return;
  }
  if (!data || typeof data !== "object") return;
  serverData = data;
  toolSchemas = {};
  const servers = Object.entries(data);
  const connectedCount = servers.filter(([, tool]) => tool.status === "connected").length;
  const toolCount = servers.reduce((sum, [, tool]) => sum + (tool.tools?.length || 0), 0);
  document.getElementById("connected-count").textContent = connectedCount;
  document.getElementById("tool-count").textContent = toolCount;
  document.getElementById("server-count").textContent = `${servers.length} servers`;
  const readyState = document.getElementById("ready-state");
  readyState.dataset.state = connectedCount === servers.length && servers.length ? "ready" : connectedCount ? "partial" : "offline";
  document.getElementById("ready-label").textContent = connectedCount === servers.length && servers.length ? "演示已就绪" : connectedCount ? `${connectedCount}/${servers.length} 服务可用` : "等待服务";
  list.innerHTML = "";
  for (const [key, t] of servers) {
    const isConnected = t.status === "connected";
    const isError = t.status && t.status.startsWith("error");
    const dotClass = isConnected ? "dot-connected" : isError ? "dot-error" : "dot-disconnected";
    const statusText = isConnected ? "已连接" : isError ? "错误" : "未连接";
    const permissions = Array.isArray(t.permissions) ? t.permissions : [];
    const examples = Array.isArray(t.examples) ? t.examples : [];
    for (const tool of (t.tools || [])) toolSchemas[`${key}__${tool.name}`] = tool.inputSchema || {};
    const card = document.createElement("div");
    card.className = "tool-card";
    card.innerHTML = `
      <div class="card-header">
        <span class="card-identity"><span class="card-icon">${TOOL_ICONS[key]||"MCP"}</span><span class="card-name">${escapeHtml(t.label)}</span></span>
        <span class="status-text"><span class="status-dot ${dotClass}"></span>${statusText}</span>
      </div>
      <div class="market-summary">${escapeHtml(t.summary || "")}</div>
      <div class="market-grid">
        <div class="market-pill"><span>类别</span><strong>${escapeHtml(t.category || "Tool")}</strong></div>
        <div class="market-pill"><span>风险</span><strong>${escapeHtml(t.risk || "未标注")}</strong></div>
      </div>
      <div class="permission-tags">
        ${permissions.map(item => `<span class="permission-tag">${escapeHtml(item)}</span>`).join("")}
      </div>
      <div class="example-line">示例：${escapeHtml(examples.slice(0,2).join(" / ") || "连接后查看工具 schema")}</div>
      <div class="tools-list">
        ${t.tools && t.tools.length ? t.tools.map(tt => `<button class="tool-chip" data-server="${key}" data-tool="${escapeHtml(tt.name)}">${escapeHtml(tt.name)}</button>`).join("") : '<span class="tools-empty">连接后读取工具</span>'}
      </div>
      <div class="actions">
        ${isConnected
          ? `<button class="btn-disconnect" onclick="disconnectTool('${key}')">断开</button>`
          : `<button class="btn-connect" onclick="connectTool('${key}')">连接</button>`
        }
        ${t.tools && t.tools.length ? `<button class="btn-test" data-server="${key}" data-tool="${escapeHtml(t.tools[0].name)}">测试</button>` : ''}
      </div>`;
    list.appendChild(card);
  }
}

document.getElementById("tool-list").addEventListener("click", function(e) {
  const button = e.target.closest("[data-server][data-tool]");
  if (button) openTestModal(button.dataset.server, button.dataset.tool);
});

async function connectAllTools() {
  const btn = document.getElementById("connect-all-btn");
  const names = Object.keys(serverData).length ? Object.keys(serverData) : Object.keys(TOOL_ICONS);
  btn.disabled = true; btn.textContent = "连接中...";
  const results = await Promise.all(names.map(async name => {
    try {
      const res = await fetch("/api/tools/connect", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name})});
      return (await res.json()).success;
    } catch(e) { return false; }
  }));
  await fetchTools();
  const count = results.filter(Boolean).length;
  btn.disabled = false; btn.textContent = count === names.length ? "重新检查" : "重试连接";
}

async function connectTool(name) {
  try {
    const res = await fetch("/api/tools/connect", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name})});
    await res.json();
  } catch(e) {}
  fetchTools();
}

async function disconnectTool(name) {
  try {
    const res = await fetch("/api/tools/disconnect", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name})});
    await res.json();
  } catch(e) {}
  fetchTools();
}

function openTestModal(server, tool) {
  lastFocused = document.activeElement;
  testServer = server; testTool = tool;
  document.getElementById("test-tool-name").value = `${server}/${tool}`;
  document.getElementById("test-params").value = JSON.stringify(buildExampleArgs(server, tool), null, 2);
  const r = document.getElementById("test-result");
  r.style.display = "none"; r.textContent = "";
  document.getElementById("test-modal").classList.add("show");
  document.getElementById("test-params").focus();
}

function buildExampleArgs(server, tool) {
  const schema = toolSchemas[`${server}__${tool}`] || {};
  const required = new Set(schema.required || []);
  const args = {};
  for (const [name, prop] of Object.entries(schema.properties || {})) {
    if (name === "user_id") continue;
    if (prop.default !== undefined) args[name] = prop.default;
    else if (PARAM_EXAMPLES[name] !== undefined) args[name] = PARAM_EXAMPLES[name];
    else if (required.has(name)) args[name] = prop.type === "number" || prop.type === "integer" ? 1 : prop.type === "boolean" ? false : "";
  }
  return args;
}

function closeTestModal() {
  document.getElementById("test-modal").classList.remove("show");
  if (lastFocused) lastFocused.focus();
}

async function runTest() {
  let args = {};
  try { args = JSON.parse(document.getElementById("test-params").value); }
  catch(e) { alert("JSON 格式错误"); return; }
  const r = document.getElementById("test-result");
  r.style.display = "block"; r.textContent = "调用中...";
  try {
    const res = await fetch("/api/tools/test", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({server:testServer,tool:testTool,arguments:args,user_id:currentUser})});
    const data = await res.json();
    r.textContent = data.error ? "调用失败：" + data.error : data.result || "(无返回)";
  } catch(e) { r.textContent = "请求失败: " + e.message; }
}

// 最小 markdown 渲染器：先转义 HTML 防 XSS，再依次解析代码块、表格、列表、引用、加粗/代码/链接。
// 不引外部库，覆盖演示场景常见的结构化输出。
function renderMarkdown(text) {
  let src = String(text ?? "");
  const blocks = [];
  // 1) 抽出代码块占位，避免内部内容被后续规则误伤
  src = src.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
    const i = blocks.length;
    blocks.push('<pre><code>' + escapeHtml(code.replace(/\n$/, '')) + '</code></pre>');
    return 'BLOCK' + i + '';
  });
  // 2) 行级解析
  const lines = src.split('\n');
  const out = [];
  let tableRows = [];
  function flushTable() {
    if (!tableRows.length) return;
    const rows = tableRows.map((row, ri) => {
      const cells = row.split('|').map(c => c.trim()).filter((_, i, a) => !(i === 0 && _ === '') && !(i === a.length - 1 && _ === ''));
      // 第二行是分隔符 | --- | --- |，跳过
      if (ri === 1 && cells.every(c => /^:?-+:?$/.test(c))) return '';
      const tag = ri === 0 ? 'th' : 'td';
      return '<tr>' + cells.map(c => '<' + tag + '>' + c + '</' + tag + '>').join('') + '</tr>';
    }).filter(Boolean);
    if (rows.length) out.push('<table>' + rows.join('') + '</table>');
    tableRows = [];
  }
  let listType = null;
  function flushList() {
    if (listType) { out.push('</' + listType + '>'); listType = null; }
  }
  for (const raw of lines) {
    const line = raw;
    // 表格行：以 | 开头
    if (/^\s*\|/.test(line) && line.includes('|')) {
      flushList();
      tableRows.push(line.trim());
      continue;
    } else if (tableRows.length) flushTable();
    // 列表
    const ul = line.match(/^\s*[-*]\s+(.*)$/);
    const ol = line.match(/^\s*\d+\.\s+(.*)$/);
    if (ul) {
      if (listType !== 'ul') { flushList(); out.push('<ul>'); listType = 'ul'; }
      out.push('<li>' + ul[1] + '</li>');
      continue;
    }
    if (ol) {
      if (listType !== 'ol') { flushList(); out.push('<ol>'); listType = 'ol'; }
      out.push('<li>' + ol[1] + '</li>');
      continue;
    }
    flushList();
    // 引用
    const bq = line.match(/^\s*>\s?(.*)$/);
    if (bq) { out.push('<blockquote>' + bq[1] + '</blockquote>'); continue; }
    // 标题
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { out.push('<h' + h[1].length + '>' + h[2] + '</h' + h[1].length + '>'); continue; }
    // 空行
    if (!line.trim()) { out.push(''); continue; }
    out.push('<p>' + line + '</p>');
  }
  flushList();
  if (tableRows.length) flushTable();
  let html = out.join('\n');
  // 3) 还原代码块
  html = html.replace(/BLOCK(\d+)/g, (_, i) => blocks[+i]);
  // 4) 行内：加粗、代码、链接（转义后再匹配，安全）
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return html;
}

function addMsg(content, type) {
  const area = document.getElementById("chat-area");
  const empty = document.getElementById("empty-state");
  if (empty) empty.style.display = "none";
  const div = document.createElement("div");
  div.className = "msg " + type;
  // assistant 消息走 markdown 渲染；其余类型保持纯文本（textContent 防 XSS）
  if (type === "assistant") {
    div.innerHTML = renderMarkdown(content);
  } else {
    div.textContent = content;
  }
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
  return div;
}

function fillPrompt(text) {
  const input = document.getElementById("chat-input");
  input.value = text;
  autoResize(input);
  input.focus();
}

function clearConversation() {
  if (streaming) return;
  conversationMessages = [];
  const area = document.getElementById("chat-area");
  for (const child of [...area.children]) if (child.id !== "empty-state") child.remove();
  const empty = document.getElementById("empty-state");
  if (empty) empty.style.display = "flex";
}

let activeTrace = null;
function startRunTrace() {
  const area = document.getElementById("chat-area");
  const root = document.createElement("section");
  root.className = "run-trace";
  root.innerHTML = '<div class="trace-head"><span class="trace-title">Agent 运行轨迹</span><span class="trace-status">准备请求</span></div><div class="trace-events"></div>';
  area.appendChild(root); area.scrollTop = area.scrollHeight;
  activeTrace = {root, status:root.querySelector(".trace-status"), events:root.querySelector(".trace-events"), started:performance.now(), calls:0, lastTool:null};
  return activeTrace;
}

function addTraceEvent(ev) {
  if (!activeTrace) return;
  if (ev.type === "thinking") { activeTrace.status.textContent = ev.content; return; }
  const row = document.createElement("div");
  row.className = "trace-event";
  const line = document.createElement("div");
  line.className = "trace-line";
  if (ev.type === "tool_call") {
    activeTrace.calls += 1;
    const server = document.createElement("span"); server.className = "trace-server"; server.textContent = (ev.server || "MCP").toUpperCase();
    const label = document.createElement("span"); label.textContent = ev.tool || ev.content;
    line.append(server, label); row.appendChild(line);
    const args = document.createElement("code"); args.className = "trace-args"; args.textContent = JSON.stringify(ev.args || {}); row.appendChild(args);
    activeTrace.lastTool = row;
  } else if (ev.type === "tool_result") {
    const details = document.createElement("details"); details.className = "trace-result";
    const summary = document.createElement("summary"); summary.textContent = "查看工具返回";
    const pre = document.createElement("pre"); pre.textContent = ev.content.replace(/^工具返回:\s*/, "");
    details.append(summary, pre);
    (activeTrace.lastTool || row).appendChild(details);
    if (activeTrace.lastTool) { document.getElementById("chat-area").scrollTop = document.getElementById("chat-area").scrollHeight; return; }
  } else if (ev.type === "memory_recall") {
    const server = document.createElement("span"); server.className = "trace-server"; server.textContent = "MEM";
    const label = document.createElement("span"); label.textContent = ev.content;
    line.append(server, label); row.appendChild(line);
  }
  activeTrace.events.appendChild(row);
  document.getElementById("chat-area").scrollTop = document.getElementById("chat-area").scrollHeight;
}

function finishRunTrace(trace, ok, finalEv) {
  if (!trace) return;
  const elapsed = ((performance.now() - trace.started) / 1000).toFixed(1);
  trace.root.classList.add(ok ? "complete" : "error");
  if (ok) {
    const calls = (finalEv && typeof finalEv.tool_calls === "number") ? finalEv.tool_calls : trace.calls;
    const timePart = (finalEv && finalEv.duration_ms != null) ? formatDurationMs(finalEv.duration_ms) : (elapsed + "s");
    let text = `完成 / ${calls} 次调用 / ${timePart}`;
    const tok = finalEv ? formatTokens(finalEv.tokens) : "-";
    if (tok !== "-") text += ` / ${tok} tok`;
    trace.status.textContent = text;
  } else {
    trace.status.textContent = `运行中断 / ${elapsed}s`;
  }
  if (activeTrace === trace) activeTrace = null;
}

function shortTraceId(id) {
  if (!id) return "无 ID";
  return String(id).slice(0, 8);
}

function formatDurationMs(ms) {
  if (ms == null || ms === "") return "-";
  const n = Number(ms);
  if (!Number.isFinite(n)) return "-";
  if (n < 1000) return Math.round(n) + "ms";
  return (n / 1000).toFixed(1) + "s";
}

function formatTokens(tokens) {
  if (!tokens || typeof tokens !== "object") return "-";
  if (tokens.total != null) return String(tokens.total);
  const p = Number(tokens.prompt) || 0;
  const c = Number(tokens.completion) || 0;
  if (!p && !c) return "-";
  return String(p + c);
}

function summarizeText(text, max) {
  const s = String(text ?? "").replace(/\s+/g, " ").trim();
  if (s.length <= max) return s;
  return s.slice(0, max) + "...";
}

function countToolCalls(events, finalEv) {
  if (finalEv && typeof finalEv.tool_calls === "number") return finalEv.tool_calls;
  return (events || []).filter(e => e && e.type === "tool_call").length;
}

function fallbackCopyText(text) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.setAttribute("readonly", "");
  ta.style.position = "fixed";
  ta.style.left = "-9999px";
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
  document.body.removeChild(ta);
  return ok;
}

async function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (e) {}
  }
  return fallbackCopyText(text);
}

async function copyTraceJson(events, finalEv, btn) {
  const payload = {
    trace_id: (finalEv && finalEv.trace_id) || (events.find(e => e && e.trace_id) || {}).trace_id || null,
    duration_ms: finalEv && finalEv.duration_ms != null ? finalEv.duration_ms : null,
    tokens: (finalEv && finalEv.tokens) || null,
    tool_calls: countToolCalls(events, finalEv),
    events
  };
  const ok = await copyText(JSON.stringify(payload, null, 2));
  const prev = btn.textContent;
  btn.textContent = ok ? "已复制" : "复制失败";
  setTimeout(() => { btn.textContent = prev; }, 1200);
}

async function replayToolCall(ev, btn, step) {
  if (!ev.server || !ev.tool) {
    alert("缺少 server/tool，无法重放");
    return;
  }
  btn.disabled = true;
  const prev = btn.textContent;
  btn.textContent = "重放中...";
  let out = step.querySelector(".diag-replay-out");
  if (!out) {
    out = document.createElement("pre");
    out.className = "diag-replay-out";
    step.appendChild(out);
  }
  out.textContent = "调用中...";
  try {
    const res = await fetch("/api/tools/test", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        server: ev.server,
        tool: ev.tool,
        arguments: ev.args && typeof ev.args === "object" ? ev.args : {},
        user_id: currentUser
      })
    });
    const data = await res.json();
    out.textContent = data.error ? ("失败: " + data.error) : (data.result || "(无返回)");
  } catch (e) {
    out.textContent = "请求失败: " + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = prev;
  }
}

function buildDiagStep(ev) {
  const step = document.createElement("div");
  step.className = "diag-step";
  if (ev.type === "tool_result" && ev.ok === false) step.classList.add("fail");

  const title = document.createElement("div");
  title.className = "diag-step-title";

  if (ev.type === "thinking") {
    title.textContent = "thinking · " + (ev.content || "");
    step.appendChild(title);
  } else if (ev.type === "memory_recall") {
    const n = Array.isArray(ev.memories) ? ev.memories.length : null;
    let label = n != null ? ("memory · " + n + " 条") : ("memory · " + (ev.content || ""));
    if (ev.duration_ms != null) label += " · " + formatDurationMs(ev.duration_ms);
    title.textContent = label;
    step.appendChild(title);
  } else if (ev.type === "tool_call") {
    let label = "tool_call · " + (ev.server || "?") + "/" + (ev.tool || ev.content || "?");
    if (ev.duration_ms != null) label += " · " + formatDurationMs(ev.duration_ms);
    title.textContent = label;
    const args = document.createElement("code");
    args.className = "diag-args";
    args.textContent = JSON.stringify(ev.args || {});
    step.append(title, args);
  } else if (ev.type === "tool_result") {
    const okLabel = ev.ok === false ? "FAIL" : (ev.ok === true ? "OK" : "result");
    let label = "tool_result · " + okLabel;
    if (ev.server || ev.tool) label += " · " + (ev.server || "?") + "/" + (ev.tool || "?");
    if (ev.duration_ms != null) label += " · " + formatDurationMs(ev.duration_ms);
    title.textContent = label;
    const result = document.createElement("div");
    result.className = "diag-result";
    result.textContent = summarizeText(String(ev.content || "").replace(/^工具返回:\s*/, ""), 200);
    step.append(title, result);
    if (ev.ok === false) {
      const replay = document.createElement("button");
      replay.type = "button";
      replay.className = "diag-replay";
      replay.textContent = "重放";
      if (!ev.server || !ev.tool) {
        replay.disabled = true;
        replay.title = "缺少 server/tool";
      } else {
        replay.addEventListener("click", () => replayToolCall(ev, replay, step));
      }
      step.appendChild(replay);
    }
  } else if (ev.type === "final") {
    let label = "final";
    if (ev.duration_ms != null) label += " · " + formatDurationMs(ev.duration_ms);
    const tok = formatTokens(ev.tokens);
    if (tok !== "-") label += " · " + tok + " tok";
    title.textContent = label;
    step.appendChild(title);
  } else {
    title.textContent = (ev.type || "event") + " · " + summarizeText(ev.content, 80);
    step.appendChild(title);
  }
  return step;
}

function attachTracePanel(assistantDiv, events, finalEv) {
  if (!assistantDiv) return;
  const list = Array.isArray(events) ? events.slice() : [];
  const fin = finalEv || list.find(e => e && e.type === "final") || {};
  const panel = document.createElement("details");
  panel.className = "diag-panel";

  const head = document.createElement("summary");
  head.className = "diag-head";
  const meta = document.createElement("span");
  meta.className = "diag-meta";
  const tid = shortTraceId(fin.trace_id || (list.find(e => e && e.trace_id) || {}).trace_id);
  const dur = formatDurationMs(fin.duration_ms);
  const tok = formatTokens(fin.tokens);
  const calls = countToolCalls(list, fin);
  meta.textContent = "诊断 · " + tid + " · " + dur + " · " + tok + " tok · " + calls + " 工具";

  const actions = document.createElement("span");
  actions.className = "diag-actions";
  const copyBtn = document.createElement("button");
  copyBtn.type = "button";
  copyBtn.textContent = "复制 JSON";
  copyBtn.addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();
    copyTraceJson(list, fin, copyBtn);
  });
  actions.appendChild(copyBtn);
  head.append(meta, actions);

  const body = document.createElement("div");
  body.className = "diag-body";
  if (!list.length) {
    const empty = document.createElement("div");
    empty.className = "diag-step";
    empty.textContent = "本次无轨迹事件";
    body.appendChild(empty);
  } else {
    for (const ev of list) body.appendChild(buildDiagStep(ev));
  }

  panel.append(head, body);
  assistantDiv.insertAdjacentElement("afterend", panel);
  const area = document.getElementById("chat-area");
  if (area) area.scrollTop = area.scrollHeight;
}

let streaming = false;
async function sendMessage() {
  if (streaming) return;
  const input = document.getElementById("chat-input");
  const text = input.value.trim();
  if (!text) return;
  input.value = ""; input.style.height = "auto";
  addMsg(text, "user");

  // Append user message to conversation history
  conversationMessages.push({role: "user", content: text});
  const trace = startRunTrace();
  const traceEvents = [];
  let completed = false;

  streaming = true;
  const btn = document.getElementById("send-btn");
  btn.disabled = true; btn.textContent = "...";

  function handleSseEvent(ev) {
    if (!ev || !ev.type) return;
    if (["thinking", "tool_call", "tool_result", "memory_recall"].includes(ev.type)) {
      traceEvents.push(ev);
      addTraceEvent(ev);
    } else if (ev.type === "final") {
      if (completed) return;
      traceEvents.push(ev);
      const assistantDiv = addMsg(ev.content, "assistant");
      completed = true;
      finishRunTrace(trace, true, ev);
      attachTracePanel(assistantDiv, traceEvents, ev);
      return ev.content || "";
    }
    return "";
  }

  try {
    const res = await fetch("/api/chat", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages: conversationMessages, user_id: currentUser})});
    if (!res.ok) { addMsg("请求失败: " + res.status, "step"); finishRunTrace(trace, false); return; }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    let finalContent = "";
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += decoder.decode(value, {stream: true});
      const lines = buf.split("\n");
      buf = lines.pop() || "";
      for (const line of lines) {
        if (line.startsWith("data: ")) {
          try {
            const content = handleSseEvent(JSON.parse(line.slice(6)));
            if (content) finalContent = content;
          } catch(e) {}
        }
      }
    }
    if (buf.trim()) {
      const m = buf.match(/^data:\s*(.+)/);
      if (m) try {
        const content = handleSseEvent(JSON.parse(m[1]));
        if (content) finalContent = content;
      } catch(e) {}
    }

    // Append assistant response to conversation history
    if (finalContent) {
      conversationMessages.push({role: "assistant", content: finalContent});
    }
    setTimeout(fetchMemories, 4000);
  } catch(err) {
    addMsg("连接失败: " + err.message, "step");
    finishRunTrace(trace, false);
  } finally {
    if (!completed && activeTrace === trace) finishRunTrace(trace, false);
    streaming = false;
    btn.disabled = false; btn.textContent = "发送";
  }
}

fetchTools();
setInterval(fetchTools, 15000);

let currentUser = "default";
let searchTimer = null;

function switchUser() {
  currentUser = document.getElementById("user-select").value;
  conversationMessages = [];  // 切换用户清空对话上下文
  addMsg("已切换到用户 " + currentUser, "system");
  fetchMemories();
}

async function fetchMemories() {
  try {
    const res = await fetch("/api/memories?user_id=" + encodeURIComponent(currentUser));
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    renderMemories(data.memories || []);
  } catch(e) { renderMemoryError(); }
}

function debounceSearchMemories() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(searchMemories, 400);
}

async function searchMemories() {
  const q = document.getElementById("memory-search-input").value.trim();
  if (!q) { fetchMemories(); return; }
  try {
    const res = await fetch("/api/memories/search?q=" + encodeURIComponent(q) + "&user_id=" + encodeURIComponent(currentUser));
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    renderMemories(data.results || []);
  } catch(e) { renderMemoryError(); }
}

function renderMemoryError() {
  document.getElementById("memory-list").innerHTML = '<div class="memory-empty">记忆服务暂不可用<br>启动 memory-server 后重试</div>';
}

function renderMemories(mems) {
  const list = document.getElementById("memory-list");
  if (!mems || !mems.length) {
    list.innerHTML = '<div class="memory-empty">暂无记忆<br>对话中的长期信息会显示在这里</div>';
    return;
  }
  list.innerHTML = mems.map(function(m) {
    var stars = "";
    var imp = m.importance || 0.5;
    for (var i = 0; i < Math.round(imp * 5); i++) stars += "★";
    var date = (m.updated_at || m.created_at || "").slice(0, 10);
    var scoreStr = (m.score !== undefined) ? " · 相关度 " + Math.round(m.score * 100) + "%" : "";
    return '<div class="memory-item">' +
      escapeHtml(m.content) +
      '<div class="mem-meta">' +
        '<span class="mem-stars">' + stars + '</span>' +
        '<span>' + escapeHtml(date + scoreStr) + ' <button class="mem-del" onclick="deleteMemory(\'' + m.id + '\')">删除</button></span>' +
      '</div></div>';
  }).join("");
}

async function deleteMemory(id) {
  if (!confirm("确认删除这条记忆？")) return;
  try {
    const res = await fetch("/api/memories/" + id + "?user_id=" + encodeURIComponent(currentUser), {method: "DELETE"});
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    fetchMemories();
  } catch(e) { renderMemoryError(); }
}

document.getElementById("test-modal").addEventListener("click", function(e) {
  if (e.target === this) closeTestModal();
});
document.addEventListener("keydown", function(e) {
  if (e.key === "Escape" && document.getElementById("test-modal").classList.contains("show")) closeTestModal();
});

fetchMemories();
